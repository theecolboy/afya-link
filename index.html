<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfyaLink Healthcare System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;

    function Login() {
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [message, setMessage] = useState("");
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userName, setUserName] = useState("");

      useEffect(() => {
        const user = localStorage.getItem("user");
        if (user) {
          setIsLoggedIn(true);
          setUserName(JSON.parse(user).name);
        }
      }, []);

      const handleLogin = (e) => {
        e.preventDefault();
        if (email && password) {
          const name = email.split("@")[0];
          localStorage.setItem("token", "demo-token");
          localStorage.setItem("user", JSON.stringify({ name, email }));
          setIsLoggedIn(true);
          setUserName(name);
          setMessage(`Welcome, ${name}!`);
          setTimeout(() => setMessage(""), 3000);
        }
      };

      const handleLogout = () => {
        const prevName = userName || "User";
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        setIsLoggedIn(false);
        setUserName("");
        setMessage(`Goodbye, ${prevName}! See you next time.`);
        setTimeout(() => setMessage(""), 3000);
      };

      return (
        <div className="flex items-center justify-center min-h-screen bg-gray-100">
          <div className="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 className="text-2xl font-bold mb-6 text-center">
              {isLoggedIn ? "Welcome!" : "Login"}
            </h2>
            {message && (
              <div className={`p-3 mb-4 rounded text-center ${
                message.includes("Welcome") ? "bg-green-100 text-green-800" : "bg-blue-100 text-blue-800"
              }`}>
                {message}
              </div>
            )}
            {isLoggedIn ? (
              <div className="text-center">
                <p className="mb-4">You are logged in as {userName}.</p>
                <button onClick={handleLogout} className="w-full bg-red-600 text-white p-2 rounded">
                  Logout
                </button>
              </div>
            ) : (
              <form onSubmit={handleLogin}>
                <div className="mb-4">
                  <label className="block text-gray-700">Email</label>
                  <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full p-2 border rounded" required />
                </div>
                <div className="mb-4">
                  <label className="block text-gray-700">Password</label>
                  <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full p-2 border rounded" required />
                </div>
                <button className="w-full bg-blue-600 text-white p-2 rounded">Login</button>
              </form>
            )}
          </div>
        </div>
      );
    }

    function Dashboard() {
      const [user, setUser] = useState(null);
      useEffect(() => {
        const storedUser = localStorage.getItem("user");
        if (storedUser) setUser(JSON.parse(storedUser));
      }, []);

      return (
        <div className="p-6">
          <h1 className="text-3xl font-bold mb-6">AfyaLink Healthcare System</h1>
          {user && <p className="text-lg text-gray-700 mb-4">Welcome back, {user.name}!</p>}
          <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-6">
            <div className="bg-blue-500 text-white p-5 rounded-xl">
              <h3 className="font-bold">Appointments</h3>
              <p>Book and manage appointments</p>
            </div>
            <div className="bg-red-500 text-white p-5 rounded-xl">
              <h3 className="font-bold">Emergency</h3>
              <p>SOS and ambulance services</p>
            </div>
            <div className="bg-green-500 text-white p-5 rounded-xl">
              <h3 className="font-bold">Telemedicine</h3>
              <p>Video consultations</p>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState("dashboard");
      return (
        <div>
          <nav className="bg-blue-600 text-white p-4">
            <div className="container mx-auto flex justify-between items-center">
              <h1 className="text-xl font-bold">AfyaLink</h1>
              <div>
                <button onClick={() => setPage("dashboard")} className="mr-4">Dashboard</button>
                <button onClick={() => setPage("login")}>Login</button>
              </div>
            </div>
          </nav>
          {page === "dashboard" && <Dashboard />}
          {page === "login" && <Login />}
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
